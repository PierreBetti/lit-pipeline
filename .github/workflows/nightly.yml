name: Literature pipeline

on:
  schedule:
    - cron: "0 7 * * *"   # every day at 07:00 UTC (3:00 in Montréal in summer, 2:00 in winter)
  workflow_dispatch:       # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write          # needed to commit the updated literature map

concurrency:
  group: lit-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache the semantic model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config.json') }}
          restore-keys: hf-
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          MAX_TRIAGE_PER_RUN: "40"
          GEMINI_SECONDS_BETWEEN_CALLS: "7"
        run: python pipeline.py

      - name: Publish the dashboard and save the audit trail
        run: |
          git config user.name "lit-pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git add data/ 2>/dev/null || true
          git add logs/ 2>/dev/null || true
          git add export/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Nightly literature review update"
          # if something else was pushed meanwhile, replay this run on top (this run's files win any conflict)
          git push || (git pull --rebase -X theirs origin main && git push)
