name: Validation

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        required: true
        default: "all"
        type: choice
        options: [all, sample, evaluate, calibration, consistency, preferences, benchmark]

permissions:
  contents: write

concurrency:
  group: lit-pipeline
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache the semantic model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config.json') }}
          restore-keys: hf-
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run validation task
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
        run: python validate.py ${{ inputs.task }}
      - name: Save results
        run: |
          git config user.name "lit-pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # keep only what validation produced, then lay it on top of the latest version of the repo
          mkdir -p /tmp/v
          for f in validation.json validation_sample.json ai_log_validation.jsonl; do
            [ -f "data/$f" ] && cp "data/$f" /tmp/v/ || true
          done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v/* data/ 2>/dev/null || true
            python validate.py render
            git add data/ docs/
            git diff --cached --quiet && exit 0
            git commit -m "Validation: ${{ inputs.task }}"
            git push && exit 0
            sleep 10
          done
          exit 1
